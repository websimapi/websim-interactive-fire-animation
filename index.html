<div class="fire-container" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;"></div>

<script>
const fireShaderFragment = `
    precision highp float;
    uniform float time;
    uniform vec2 resolution;
    varying vec2 vUv;

    // ...existing noise functions remain the same...

    void main() {
        vec2 uv = vUv;
        uv.y = 1.0 - uv.y;
        
        float speed = 0.5;
        float scale = 5.0;
        float timeFactor = time * speed;
        
        vec3 p = vec3(uv * scale, timeFactor);
        float noise1 = snoise(p);
        float noise2 = snoise(p * 1.3 + vec3(0.0, -timeFactor * 0.7, 0.0));
        float noise3 = snoise(p * 2.1 + vec3(0.0, -timeFactor * 0.5, 0.0));
        
        float combinedNoise = (noise1 + noise2 * 0.5 + noise3 * 0.25) * 0.8;
        
        float fire = smoothstep(0.3, 0.8, uv.y + combinedNoise * 0.3);
        fire = pow(fire, 2.0);
        
        vec3 color = mix(
            vec3(0.1, 0.1, 0.1),
            mix(
                vec3(1.0, 0.5, 0.1),
                mix(
                    vec3(1.0, 0.9, 0.1),
                    vec3(1.0, 0.9, 0.7),
                    fire * 1.5
                ),
                fire
            ),
            fire
        );
        
        float ember = pow(snoise(p * 5.0 + vec3(0.0, -timeFactor * 2.0, 0.0)), 4.0);
        color += ember * 0.5;
        
        // Set alpha based on brightness (black/dark areas become transparent)
        float alpha = step(0.05, length(color));
        gl_FragColor = vec4(color, alpha);
    }
`;
</script>
